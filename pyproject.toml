[project]
name = "tilde-path-expander"
version = "0.1.1"
description = "Expands user home directory tildes in paths and collapses redundant separators and parent references."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
